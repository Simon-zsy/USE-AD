[project]
name = "tabpfn-ad-paper"
version = "0.1.0"
description = "Paper-oriented implementation of universal semantic enhancement for weakly supervised tabular anomaly detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "tabpfn==6.2.0", "torch>=2.0", "numpy>=1.24", "pandas>=2.0",
  "scikit-learn>=1.3", "pydantic>=2.0", "PyYAML>=6.0", "rich>=13.0",
]

[project.optional-dependencies]
baselines = ["autogluon-tabular>=1.5.0", "catboost>=1.2.8"]
plots = ["matplotlib>=3.7"]
